# ---------------------------------------------------------------------------
# Real-Time Data Pipeline - single-host Docker Compose stack.
#
# HONESTY NOTE (carried into the README verbatim):
#   This is a multi-BROKER Kafka cluster and a multi-NODE Cassandra ring running
#   as containers on ONE physical host. It is not a multi-node deployment.
#   Killing a container here proves failover logic, not datacentre failover.
#
# Profiles:
#   (default)      kafka x3, cassandra x3, postgres, spark master + 2 workers
#   obs            prometheus, grafana, kafka-lag-exporter
#   orchestration  airflow scheduler + webserver
# Benchmarks run on (default)+obs so Airflow's ~1.5GB does not distort results.
# ---------------------------------------------------------------------------

x-kafka-common: &kafka-common
  image: apache/kafka:3.9.0
  restart: unless-stopped
  environment: &kafka-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    # RF=3 with min.insync.replicas=2 is what makes the Section 7.3 broker-kill
    # test survivable: one broker down still leaves a writable ISR of 2.
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_NUM_PARTITIONS: ${TOPIC_PARTITIONS}
    KAFKA_LOG_RETENTION_HOURS: 24
    KAFKA_HEAP_OPTS: -Xmx448m -Xms448m
    KAFKA_JMX_OPTS: >-
      -Dcom.sun.management.jmxremote
      -Dcom.sun.management.jmxremote.authenticate=false
      -Dcom.sun.management.jmxremote.ssl=false
      -Dcom.sun.management.jmxremote.local.only=false
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
    interval: 10s
    timeout: 10s
    retries: 20
    start_period: 30s
  mem_limit: 820m
  networks: [rtdp]

x-cassandra-common: &cassandra-common
  image: cassandra:5.0
  restart: unless-stopped
  environment: &cassandra-env
    CASSANDRA_CLUSTER_NAME: rtdp-ring
    CASSANDRA_SEEDS: cassandra1,cassandra2
    CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    CASSANDRA_DC: dc1
    CASSANDRA_RACK: rack1
    # Sized for a 12 GiB Docker budget shared with Kafka, Spark and Postgres.
    # Cassandra's container footprint is heap + direct memory + memtable
    # off-heap + metaspace; capping only the heap lets the rest drift into the
    # container limit and the JVM gets killed. MaxDirectMemorySize is the knob
    # that actually bounds it - without it Cassandra defaults direct memory to
    # the heap size and the container needs roughly 2x what you budgeted.
    MAX_HEAP_SIZE: 640M
    HEAP_NEWSIZE: 128M
    JVM_OPTS: >-
      -Dcassandra.skip_wait_for_gossip_to_settle=0
      -XX:MaxDirectMemorySize=384M
      -XX:MaxMetaspaceSize=192M
      -Dcassandra.available_processors=3
  healthcheck:
    test: ["CMD-SHELL", "nodetool status | grep -E '^UN' >/dev/null || exit 1"]
    interval: 15s
    timeout: 15s
    retries: 30
    start_period: 90s
  mem_limit: 1600m
  networks: [rtdp]

services:

  # ========================= Kafka (3 brokers, KRaft) =======================
  kafka1:
    <<: *kafka-common
    container_name: rtdp-kafka1
    hostname: kafka1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:19092
    ports: ["19092:19092"]
    volumes: ["kafka1-data:/var/lib/kafka/data"]

  kafka2:
    <<: *kafka-common
    container_name: rtdp-kafka2
    hostname: kafka2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://localhost:19093
    ports: ["19093:19093"]
    volumes: ["kafka2-data:/var/lib/kafka/data"]

  kafka3:
    <<: *kafka-common
    container_name: rtdp-kafka3
    hostname: kafka3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://localhost:19094
    ports: ["19094:19094"]
    volumes: ["kafka3-data:/var/lib/kafka/data"]

  # One-shot: creates trips.raw and trips.dlq with the documented topology.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: rtdp-kafka-init
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    environment:
      BOOTSTRAP: ${KAFKA_BOOTSTRAP_INTERNAL}
      TOPIC_TRIPS: ${TOPIC_TRIPS}
      TOPIC_DLQ: ${TOPIC_DLQ}
      PARTS: ${TOPIC_PARTITIONS}
      RF: ${TOPIC_REPLICATION}
      MIN_ISR: ${TOPIC_MIN_ISR}
    entrypoint: ["/bin/bash", "/init/create-topics.sh"]
    volumes: ["./scripts:/init:ro"]
    networks: [rtdp]
    restart: on-failure

  # ========================= Cassandra (3-node ring) ========================
  # Bootstrapped strictly one at a time: two nodes joining a ring concurrently
  # is the classic way to corrupt token assignment.
  cassandra1:
    <<: *cassandra-common
    container_name: rtdp-cassandra1
    hostname: cassandra1
    ports: ["9042:9042"]
    volumes: ["cassandra1-data:/var/lib/cassandra"]

  cassandra2:
    <<: *cassandra-common
    container_name: rtdp-cassandra2
    hostname: cassandra2
    depends_on:
      cassandra1: {condition: service_healthy}
    volumes: ["cassandra2-data:/var/lib/cassandra"]

  cassandra3:
    <<: *cassandra-common
    container_name: rtdp-cassandra3
    hostname: cassandra3
    depends_on:
      cassandra2: {condition: service_healthy}
    volumes: ["cassandra3-data:/var/lib/cassandra"]

  # ========================= PostgreSQL =====================================
  postgres:
    image: postgres:16.4-alpine
    container_name: rtdp-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >-
      postgres -c shared_buffers=256MB -c work_mem=16MB
               -c max_connections=60 -c effective_cache_size=768MB
               -c track_io_timing=on -c shared_preload_libraries=pg_stat_statements
    ports: ["15432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 450m
    networks: [rtdp]

  # ========================= Spark standalone cluster =======================
  spark-master:
    build: {context: ., dockerfile: docker/spark/Dockerfile}
    image: rtdp/spark:3.5.3
    container_name: rtdp-spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_WEBUI_PORT: "8080"
    ports: ["18080:8080", "7077:7077"]
    volumes:
      - ./common:/opt/app/common:ro
      - ./streaming:/opt/app/streaming:ro
      - ./replay:/opt/app/replay:ro
      - spark-checkpoints:/opt/checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    mem_limit: 700m
    networks: [rtdp]

  spark-worker-1: &spark-worker
    build: {context: ., dockerfile: docker/spark/Dockerfile}
    image: rtdp/spark:3.5.3
    container_name: rtdp-spark-worker-1
    hostname: spark-worker-1
    depends_on:
      spark-master: {condition: service_healthy}
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "3"
      SPARK_WORKER_MEMORY: "1100m"
      SPARK_WORKER_WEBUI_PORT: "8081"
    ports: ["18081:8081"]
    volumes:
      - ./common:/opt/app/common:ro
      - ./streaming:/opt/app/streaming:ro
      - ./replay:/opt/app/replay:ro
      - spark-checkpoints:/opt/checkpoints
    mem_limit: 1450m
    networks: [rtdp]

  spark-worker-2:
    <<: *spark-worker
    container_name: rtdp-spark-worker-2
    hostname: spark-worker-2
    ports: ["18082:8081"]

  # Long-lived driver container. `make stream-start` execs spark-submit here in
  # client mode, so killing an *executor* (Section 7.3) does not kill the driver
  # and checkpoint recovery is genuinely exercised.
  spark-driver:
    build: {context: ., dockerfile: docker/spark/Dockerfile}
    image: rtdp/spark:3.5.3
    container_name: rtdp-spark-driver
    hostname: spark-driver
    depends_on:
      spark-master: {condition: service_healthy}
    command: ["sleep", "infinity"]
    env_file: [.env]
    environment:
      PYTHONUNBUFFERED: "1"
      SPARK_DRIVER_HOST: spark-driver
    ports: ["4040:4040", "9109:9109"]
    volumes:
      - ./common:/opt/app/common:ro
      - ./streaming:/opt/app/streaming:ro
      - ./replay:/opt/app/replay:ro
      - ./bench:/opt/app/bench:ro
      - ./tests:/opt/app/tests:ro
      - ./scripts:/opt/app/scripts:ro
      - ./sql:/opt/app/sql:ro
      - ./results:/opt/app/results
      - spark-checkpoints:/opt/checkpoints
    mem_limit: 950m
    networks: [rtdp]

  # ========================= Producer / harness runner ======================
  producer:
    build: {context: ., dockerfile: docker/producer/Dockerfile}
    image: rtdp/producer:1.0
    container_name: rtdp-producer
    hostname: producer
    command: ["sleep", "infinity"]
    env_file: [.env]
    environment:
      PYTHONUNBUFFERED: "1"
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP_INTERNAL}
    ports: ["9108:9108"]
    volumes:
      - ./common:/opt/app/common:ro
      - ./producer:/opt/app/producer:ro
      - ./bench:/opt/app/bench:ro
      - ./tests:/opt/app/tests:ro
      - ./streaming:/opt/app/streaming:ro
      - ./replay:/opt/app/replay:ro
      - ./sql:/opt/app/sql:ro
      - ./schemas:/opt/app/schemas:ro
      - ./results:/opt/app/results
    mem_limit: 500m
    networks: [rtdp]

  # ========================= Observability (profile: obs) ===================
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: rtdp-kafka-exporter
    profiles: [obs]
    command:
      - --kafka.server=kafka1:9092
      - --kafka.server=kafka2:9092
      - --kafka.server=kafka3:9092
      - --web.listen-address=:9308
    ports: ["19308:9308"]
    mem_limit: 150m
    networks: [rtdp]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: rtdp-prometheus
    profiles: [obs]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    ports: ["19090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 500m
    networks: [rtdp]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: rtdp-grafana
    profiles: [obs]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    ports: ["13000:3000"]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 350m
    networks: [rtdp]
    restart: unless-stopped

  # ================== Orchestration (profile: orchestration) ================
  airflow-init:
    build: {context: ., dockerfile: docker/airflow/Dockerfile}
    image: rtdp/airflow:2.10.3
    container_name: rtdp-airflow-init
    profiles: [orchestration]
    depends_on:
      postgres: {condition: service_healthy}
    env_file: [.env]
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__CORE__PARALLELISM: "8"
      AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "false"
      AIRFLOW_UID: "50000"
      DOCKER_HOST: unix:///var/run/docker.sock
    entrypoint: ["/bin/bash", "/opt/airflow/init/airflow-init.sh"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./scripts:/opt/airflow/init:ro
      - airflow-logs:/opt/airflow/logs
    networks: [rtdp]

  airflow-scheduler:
    image: rtdp/airflow:2.10.3
    container_name: rtdp-airflow-scheduler
    profiles: [orchestration]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    env_file: [.env]
    environment: *airflow-env
    command: ["scheduler"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./common:/opt/app/common:ro
      - ./bench:/opt/app/bench:ro
      - ./replay:/opt/app/replay:ro
      - airflow-logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 1100m
    networks: [rtdp]
    restart: unless-stopped

  airflow-webserver:
    image: rtdp/airflow:2.10.3
    container_name: rtdp-airflow-webserver
    profiles: [orchestration]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    env_file: [.env]
    environment: *airflow-env
    command: ["webserver"]
    ports: ["18088:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
    mem_limit: 900m
    networks: [rtdp]
    restart: unless-stopped

networks:
  rtdp:
    name: rtdp-net
    driver: bridge

volumes:
  kafka1-data: {}
  kafka2-data: {}
  kafka3-data: {}
  cassandra1-data: {}
  cassandra2-data: {}
  cassandra3-data: {}
  postgres-data: {}
  spark-checkpoints: {}
  prometheus-data: {}
  airflow-logs: {}
